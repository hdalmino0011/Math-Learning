  <path d="M 410 90 L 420 115 L 445 118 L 425 135 L 430 160 L 410 145 L 390 160 L 395 135 L 375 118 L 400 115 Z" fill="url(#starGrad)" />
  <path d="M 256 360 L 268 390 L 298 394 L 274 414 L 280 444 L 256 426 L 232 444 L 238 414 L 214 394 L 244 390 Z" fill="url(#starGrad)" />

  <!-- App Title Banner -->
  <rect x="76" y="390" width="360" height="70" rx="35" fill="#fbbf24" stroke="#ffffff" stroke-width="8" />
  <text x="256" y="438" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#78350f" letter-spacing="1">MULTI PLAY!</text>
</svg>
